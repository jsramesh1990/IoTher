# IoTher Configuration File
# Where devices breathe and data flows

[broker]
port = 1883
max_clients = 100
log_file = iother.log
enable_metrics = true

[simulation]
default_publish_interval = 3000
enable_wildcards = true
enable_retained_messages = false

[devices]
# Pre-configured device types
environmental_sensors = true
hvac_controllers = true
lighting_systems = true
security_sensors = true

[dashboard]
enable_dashboard = true
refresh_rate = 2
max_history = 100
